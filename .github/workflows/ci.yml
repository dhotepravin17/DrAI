name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web app (build and lint)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run lint

  api:
    name: API (tests on SQL Server)
    runs-on: ubuntu-24.04
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: Ci-Test-Passw0rd!
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci-Test-Passw0rd!' -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s --health-timeout 5s --health-retries 20 --health-start-period 20s
    env:
      SMARTQUEUE_TEST_SQL: Server=localhost,1433;User Id=sa;Password=Ci-Test-Passw0rd!;TrustServerCertificate=True
      DOTNET_NOLOGO: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger "console;verbosity=normal"

  deploy-files:
    name: Deployment files (compose and scripts)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        working-directory: deploy/vps
        run: |
          cp .env.example .env
          DOMAIN=ci.example.in ACME_EMAIL=ci@example.in SA_PASSWORD=Example-Passw0rd docker compose config --quiet
      - name: Check shell scripts
        run: |
          for f in deploy/vps/scripts/*.sh; do bash -n "$f"; done
          shellcheck --severity=error deploy/vps/scripts/*.sh
