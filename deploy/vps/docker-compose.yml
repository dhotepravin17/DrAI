# Valmedo - Appointment on a single Linux server (budget VPS).
# Usage (in this folder, after creating .env from .env.example):
#   docker compose up -d
# See docs/deployment.md, "Budget VPS".

name: valmedo

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express            # free licence; databases up to 10 GB
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Set SA_PASSWORD in .env}
      MSSQL_MEMORY_LIMIT_MB: ${SQL_MEMORY_LIMIT_MB:-1536}
      TZ: UTC
    volumes:
      - sqldata:/var/opt/mssql
      - ./backups:/var/opt/mssql/backups
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    # No ports published: the database is reachable only from the app containers.

  migrate:
    image: ${MIGRATOR_IMAGE:-ghcr.io/dhotepravin17/drai-migrator}:${IMAGE_TAG:-latest}
    environment:
      ConnectionStrings__Default: Server=db;Database=SmartQueue;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=True
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: ${APP_IMAGE:-ghcr.io/dhotepravin17/drai}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      ConnectionStrings__Default: Server=db;Database=SmartQueue;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Encrypt=True
      Bootstrap__ApplyMigrationsOnStartup: "false"
      Proxy__TrustAll: "true"       # only Caddy can reach this container
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Port 8080 stays internal; Caddy publishes 80/443.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  backup:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    user: root
    entrypoint: ["/bin/bash", "/scripts/backup-loop.sh"]
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-21}   # 21:00 UTC = 02:30 IST
    volumes:
      - ./backups:/var/opt/mssql/backups
      - ./scripts/backup-loop.sh:/scripts/backup-loop.sh:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  sqldata:
  caddy_data:
  caddy_config:
